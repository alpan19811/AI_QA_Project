services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_qa_postgres
    environment:
      POSTGRES_DB: ai_qa_db
      POSTGRES_USER: ai_qa_user
      POSTGRES_PASSWORD: ai_qa_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_qa_user -d ai_qa_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: